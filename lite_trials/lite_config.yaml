# Lite config for quick trial runs (~20K env steps, n=8-12)
curriculum:
  phases:
    - name: phase_lite
      start_env_step: 0
      end_env_step: 20000
      n_min: 8
      n_max: 12

env:
  num_envs: 4
  top_k: 64
  dist_cap: 4
  terminal_bonus_coef: 0.2
  # reward_alpha: 0.5  # (legacy 2-term weight, superseded)
  reward_eta: 0.0
  # 3-term reward weights: r_t = α₁·Δλ₂/n + α₂·η_R·ΔR_G/n² + α₃·η_P·ΔP_min
  reward_alpha_1: 0.2
  reward_alpha_2: 0.3
  reward_alpha_3: 0.5
  reward_eta_p: 1.0

model:
  gat_hidden_dim: 32
  gat_heads: 2
  gat_layers: 2
  edge_mlp_hidden_dim: 64
  value_mlp_hidden_dim: 64

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  learning_rate: 0.0003
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 1.0
  update_epochs: 4
  minibatch_size: 64
  rollout_env_steps: 1024

logging:
  console_log_every_env_steps: 2000
  eval_every_env_steps: 1000
  metrics_path: lite_trials/metrics.csv
  tensorboard_dir: lite_trials/tensorboard
  run_state_path: lite_trials/run_state.json

checkpoint:
  every_env_steps: 2000
  keep_last_k: 3
  dir: lite_trials/checkpoints

determinism:
  strict: false
  seed: 1234
  num_threads: 2

evaluation:
  episodes: 4

train:
  max_env_steps: 20000
  output_dir: lite_trials

variant:
  name: full

init:
  mode: path
