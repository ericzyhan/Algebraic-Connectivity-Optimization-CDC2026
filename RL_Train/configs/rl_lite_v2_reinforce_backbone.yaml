curriculum:
  phases:
    - name: phase_a_12_16
      start_env_step: 0
      end_env_step: 400000
      n_min: 12
      n_max: 16
    - name: phase_b_16_32
      start_env_step: 400000
      end_env_step: 800000
      n_min: 16
      n_max: 32
    - name: phase_c_16_64
      start_env_step: 800000
      end_env_step: 1200000
      n_min: 16
      n_max: 64

env:
  num_envs: 8
  top_k: 128
  dist_cap: 4
  terminal_bonus_coef: 0.2

model:
  gat_hidden_dim: 64
  gat_heads: 4
  gat_layers: 2
  edge_mlp_hidden_dim: 128
  value_mlp_hidden_dim: 128

trainer:
  algo: reinforce

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  learning_rate: 0.0003
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 1.0
  update_epochs: 4
  minibatch_size: 64
  rollout_env_steps: 2048

reinforce:
  gamma: 0.99
  learning_rate: 0.0003
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 1.0
  rollout_env_steps: 2048
  minibatch_size: 64
  update_epochs: 1
  normalize_advantage: true

lite_v2:
  actor_topk_ratio: 0.12
  actor_topk_min: 32
  actor_topk_max: 160
  selector_hidden_dim: 64
  selector_layers: 2
  selector_learning_rate: 0.0003
  selector_weight_decay: 0.0
  selector_max_grad_norm: 1.0
  selector_update_every_env_steps: 8
  teacher_weight_lambda2: 0.7
  teacher_weight_lambda3: 0.3
  reward_shaping_coef: 0.02
  reward_weight_lambda2: 0.7
  reward_weight_lambda3: 0.3
  fast_inference: true

logging:
  console_log_every_env_steps: 200
  eval_every_env_steps: 2000
  metrics_path: experiments/rl/runs/lite_v2_reinforce_backbone/metrics.csv
  tensorboard_dir: experiments/rl/runs/lite_v2_reinforce_backbone/tensorboard
  run_state_path: experiments/rl/runs/lite_v2_reinforce_backbone/run_state.json

checkpoint:
  every_env_steps: 2000
  keep_last_k: 5
  dir: experiments/rl/runs/lite_v2_reinforce_backbone/checkpoints

determinism:
  strict: true
  seed: 1234
  num_threads: 1

evaluation:
  episodes: 8

train:
  max_env_steps: 1200000
  output_dir: experiments/rl/runs/lite_v2_reinforce_backbone

variant:
  name: lite_v2

init:
  mode: backbone

backbone_init:
  routing_mode: window
  rho_very_low: 0.05
  rho_low_mix_end: 0.10
  rho_low: 0.5
  rho_high: 0.75
  cayley_samples: 500
  cayley_degree_slack: 0
  cayley_multi_index_overlap: false
  cayley_index2_overlap_high: 0.6
  cayley_spectral_backend: cpu
  cayley_eval_batch_size: 128
  force_connected_backbone: true
