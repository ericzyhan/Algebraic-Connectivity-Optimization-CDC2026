[project]
name = "graph-design"
version = "0.1.0"
description = "Density-dependent backbone design for algebraic connectivity maximization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.0",
  "numpy>=1.24",
  "scipy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
