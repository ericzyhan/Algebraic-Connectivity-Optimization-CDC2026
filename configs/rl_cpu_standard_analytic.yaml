# Analytic path-vs-backbone config — mirrors the old-model README run
# (Old Model/Algebraic-Connectivity-Optimization-CDC2026/README.md) for
# analytic_tractable_test_deepseek.
#
# Reward blend (convex combination, alpha_1 + alpha_2 + alpha_3 = 1):
#   r_t = a1 * Delta(lambda_2)/n            (algebraic connectivity)
#       + a2 * eta_R * Delta(R_G)/n^2       (effective-resistance change)
#       + a3 * eta_P * Delta(P_min)         (resistance curvature)
# Requested: 0.2 alg-conn / 0.5 eff-resistance change / 0.3 res-curv.
# reward_eta / reward_eta_p = 0 -> auto-calibrated per n (package default).

curriculum:
  phases:
    - name: phase_a_12_16
      start_env_step: 0
      end_env_step: 400000
      n_min: 12
      n_max: 16
    - name: phase_b_16_32
      start_env_step: 400000
      end_env_step: 800000
      n_min: 16
      n_max: 32
    - name: phase_c_16_64
      start_env_step: 800000
      end_env_step: 1200000
      n_min: 16
      n_max: 64

env:
  num_envs: 8
  top_k: 128
  dist_cap: 4
  terminal_bonus_coef: 0.2
  reward_alpha_1: 0.2    # algebraic connectivity (Delta(lambda_2)/n)
  reward_alpha_2: 0.5    # effective-resistance change (eta_R * Delta(R_G)/n^2)
  reward_alpha_3: 0.3    # resistance curvature (eta_P * Delta(P_min))
  reward_eta: 0.0        # 0 = auto-calibrated per n
  reward_eta_p: 0.0      # 0 = auto-calibrated per n

model:
  gat_hidden_dim: 64
  gat_heads: 4
  gat_layers: 2
  edge_mlp_hidden_dim: 128
  value_mlp_hidden_dim: 128

trainer:
  algo: ppo

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  learning_rate: 0.0003
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 1.0
  update_epochs: 4
  minibatch_size: 64
  rollout_env_steps: 2048

logging:
  console_log_every_env_steps: 200
  eval_every_env_steps: 2000
  metrics_path: experiments/rl/runs/analytic_path_init/metrics.csv
  tensorboard_dir: experiments/rl/runs/analytic_path_init/tensorboard
  run_state_path: experiments/rl/runs/analytic_path_init/run_state.json

checkpoint:
  every_env_steps: 2000
  keep_last_k: 5
  dir: experiments/rl/runs/analytic_path_init/checkpoints

determinism:
  strict: true
  seed: 1234
  num_threads: 1

evaluation:
  episodes: 8

train:
  max_env_steps: 1200000
  output_dir: experiments/rl/runs/analytic_path_init

variant:
  name: full

init:
  mode: path

backbone_init:
  routing_mode: window
  rho_very_low: 0.05
  rho_low_mix_end: 0.10
  rho_low: 0.5
  rho_high: 0.75
  cayley_samples: 500
  cayley_degree_slack: 0
  cayley_multi_index_overlap: false
  cayley_index2_overlap_high: 0.6
  cayley_spectral_backend: cpu
  cayley_eval_batch_size: 128
  force_connected_backbone: true
